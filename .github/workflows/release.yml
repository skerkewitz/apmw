# Publishes apmw, apmw.cmd and apmw.sha256 as release assets when a tag v* is pushed.
# ./apmw --apmw-upgrade downloads exactly these three files.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: |
          shellcheck apmw
          # .gitattributes must have given apmw.cmd CRLF line endings
          file apmw.cmd | grep -q CRLF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum apmw apmw.cmd > apmw.sha256
          gh release create "$GITHUB_REF_NAME" apmw apmw.cmd apmw.sha256 \
            --title "apmw $GITHUB_REF_NAME" --generate-notes
